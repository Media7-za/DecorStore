name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Type-check
        run: pnpm run type-check

      - name: Run Tests
        run: pnpm run test

      - name: Vercel Preview Deployment (Placeholder)
        run: |
          echo "Triggering Vercel Preview Deployment..."
          # In a real scenario, you would use something like:
          # uses: amondnet/vercel-action@v20
